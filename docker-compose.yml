version: "3.9"

# Saker Energy - Full Stack Docker Compose
# Usage: docker compose up -d
# Then open http://localhost:3000 for dashboard

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: saker-timescaledb
    environment:
      POSTGRES_USER: saker
      POSTGRES_PASSWORD: saker_dev_password
      POSTGRES_DB: saker
    ports:
      - "55432:5432"
    volumes:
      - tsdb_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saker -d saker"]
      interval: 5s
      timeout: 5s
      retries: 10

  nats:
    image: nats:2.10
    container_name: saker-nats
    command: ["-js", "-sd", "/data"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD", "nats", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Frontend dashboard
  dashboard:
    image: node:22-alpine
    container_name: saker-dashboard
    working_dir: /app
    volumes:
      - ./dashboard-next:/app
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm run dev"
    depends_on:
      - timescaledb
      - nats
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080

volumes:
  tsdb_data:
  nats_data:
