version: "3.9"

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: saker-timescaledb
    environment:
      POSTGRES_USER: saker
      POSTGRES_PASSWORD: saker_dev_password
      POSTGRES_DB: saker
    ports:
      - "55432:5432"
    volumes:
      - tsdb_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saker -d saker"]
      interval: 5s
      timeout: 5s
      retries: 10

  nats:
    image: nats:2.10
    container_name: saker-nats
    command: ["-js", "-sd", "/data"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD", "nats", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tsdb_data:
  nats_data:
